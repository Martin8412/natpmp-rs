version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
  # Fuzz harness has its own Cargo.toml/Cargo.lock. These deps don't ship in the
  # binary, so auto-release.yml skips releases for updates that don't touch the
  # root crate's lockfile.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cargo-fuzz:
        patterns:
          - "*"
