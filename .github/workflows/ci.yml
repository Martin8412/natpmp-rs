name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update Rust to stable
        run: rustup update stable && rustup default stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        run: rustup update nightly && rustup default nightly

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1

      - name: Fuzz parse_natpmp_response
        run: cargo fuzz run parse_natpmp_response -- -max_total_time=30

      - name: Fuzz parse_proc_net_route
        run: cargo fuzz run parse_proc_net_route -- -max_total_time=30

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust with rust-src
        run: |
          rustup update nightly
          rustup default nightly
          rustup component add rust-src

      - name: Run tests under AddressSanitizer
        env:
          RUSTFLAGS: -Z sanitizer=address
        run: cargo test -Z build-std --target x86_64-unknown-linux-gnu

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update Rust to stable
        run: rustup update stable && rustup default stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Fails CI if Cargo.lock contains a crate with a known RustSec advisory,
      # which (with auto-merge) blocks a vulnerable dependency bump from landing.
      - name: Audit dependencies
        run: cargo audit
